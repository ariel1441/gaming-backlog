name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - Dev

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game_backlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d game_backlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/game_backlog
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use stable npm
        run: npm install --global npm@10.9.4 --no-audit --no-fund

      - name: Install
        run: npm ci --include=dev --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-database-migrations
      cancel-in-progress: false
    env:
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      PGSSL: "true"
      PGSSL_CA: ${{ secrets.PGSSL_CA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Require production migration target
        if: env.PROD_DATABASE_URL == ''
        run: |
          echo "PROD_DATABASE_URL is required for protected production migrations."
          exit 1

      - name: Show pending production migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CONFIRM_PROD_MIGRATIONS: "true"
          PGSSL: "true"
        run: npm run db:migrate:prod:status

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CONFIRM_PROD_MIGRATIONS: "true"
          PGSSL: "true"
        run: npm run db:migrate:prod
