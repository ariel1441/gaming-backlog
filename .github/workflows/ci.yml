name: CI

permissions:
  contents: read
  statuses: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - Dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/Dev' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game_backlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d game_backlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/game_backlog
      JWT_SECRET: ci-test-secret

    steps:
      - name: Report CI status to Vercel
        if: github.event_name == 'push'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - gaming-backlog: ci"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@10.9.4 --no-audit --no-fund

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci --include=dev --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-database-migrations
      cancel-in-progress: false
    env:
      NODE_ENV: production
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      PGSSL: "true"
      PGSSL_CA: ${{ secrets.PGSSL_CA }}
      # Railway's public Postgres proxy encrypts traffic with an untrusted chain.
      # Keep this explicit and scoped to the production migration job.
      PGSSL_ALLOW_UNVERIFIED_PROD: "true"

    steps:
      - name: Report production migration status to Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - gaming-backlog: production-migration"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@10.9.4 --no-audit --no-fund

      - name: Install production migration dependencies
        env:
          NPM_CONFIG_INCLUDE: ""
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Require production migration target
        if: env.PROD_DATABASE_URL == ''
        run: |
          echo "PROD_DATABASE_URL is required for protected production migrations."
          exit 1

      - name: Show pending production migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CONFIRM_PROD_MIGRATIONS: "true"
          PGSSL: "true"
        run: npm run db:migrate:prod:status

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CONFIRM_PROD_MIGRATIONS: "true"
          PGSSL: "true"
        run: npm run db:migrate:prod
